spring:
  application:
    name: ingestion-service
  datasource:
    url: jdbc:postgresql://localhost:5432/frauddb
    username: fraud
    password: fraud
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info

fraud:
  rules:
    amount-threshold: 10000
    velocity-max-count: 5
    velocity-window-minutes: 5
