global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ingestion-service
    static_configs:
      - targets: ['host.docker.internal:8081']
    metrics_path: /actuator/prometheus

  - job_name: enrichment-service
    static_configs:
      - targets: ['host.docker.internal:8082']
    metrics_path: /actuator/prometheus

  - job_name: rules-service
    static_configs:
      - targets: ['host.docker.internal:8083']
    metrics_path: /actuator/prometheus

  - job_name: scoring-service
    static_configs:
      - targets: ['host.docker.internal:8084']
    metrics_path: /actuator/prometheus

  - job_name: decision-service
    static_configs:
      - targets: ['host.docker.internal:8085']
    metrics_path: /actuator/prometheus

  - job_name: case-management-service
    static_configs:
      - targets: ['host.docker.internal:8086']
    metrics_path: /actuator/prometheus

  - job_name: feedback-service
    static_configs:
      - targets: ['host.docker.internal:8087']
    metrics_path: /actuator/prometheus
