spring:
  application:
    name: case-management-service
  datasource:
    url: jdbc:postgresql://localhost:5432/frauddb
    username: fraud
    password: fraud
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: case-management-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.fraudplatform.common.dto"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  security:
    users:
      - username: analyst1
        password: "{noop}analyst1pass"
        roles: ANALYST
      - username: admin1
        password: "{noop}admin1pass"
        roles: ADMIN

server:
  port: 8086

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

otel:
  exporter:
    otlp:
      endpoint: http://localhost:4317
  resource:
    attributes:
      service.name: case-management-service

kafka:
  topics:
    final-decisions: final-decisions
    feedback-events: feedback-events
