  minReplicaCount: {{ .Values.services.decision.hpa.minReplicas }}
  maxReplicaCount: {{ .Values.services.decision.hpa.maxReplicas }}
  cooldownPeriod: 300
  pollingInterval: 15
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: {{ $bs | quote }}
        consumerGroup: decision-group
        topic: decision-events
        lagThreshold: {{ .Values.services.decision.hpa.kafkaLagThreshold | quote }}
        offsetResetPolicy: earliest

---
# ── feedback-service ──────────────────────────────────────────────────────────
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: feedback-service-keda
  labels:
    {{- include "fraud-platform.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: feedback-service
  minReplicaCount: {{ .Values.services.feedback.hpa.minReplicas }}
  maxReplicaCount: {{ .Values.services.feedback.hpa.maxReplicas }}
  cooldownPeriod: 300
  pollingInterval: 15
  triggers:
