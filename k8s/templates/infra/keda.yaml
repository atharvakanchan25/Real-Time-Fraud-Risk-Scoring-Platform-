      metadata:
        bootstrapServers: {{ $bs | quote }}
        consumerGroup: feedback-group
        topic: feedback-events
        lagThreshold: {{ .Values.services.feedback.hpa.kafkaLagThreshold | quote }}
        offsetResetPolicy: earliest
