spring:
  application:
    name: feedback-service
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: feedback-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.fraudplatform.common.dto"

server:
  port: 8087

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

# How much to bump the risk score on confirmed fraud (0.0–1.0 added to existing score)
feedback:
  risk-bump: 0.5
  reputation-ttl-seconds: 86400
