spring:
  application:
    name: scoring-service
  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    url: jdbc:postgresql://localhost:5432/frauddb
    username: fraud
    password: fraud
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: scoring-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.fraudplatform.common.dto"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        retries: 2147483647

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  endpoint:
    health:
      show-details: always

otel:
  exporter:
    otlp:
      endpoint: http://localhost:4317
  resource:
    attributes:
      service.name: scoring-service

fraud:
  rules:
    amount-threshold: 10000
    velocity-max-count: 5
    velocity-window-minutes: 5

kafka:
  topics:
    payment-events: payment-events
    decision-events: decision-events
    payment-events-dlq: payment-events-dlq

enrichment:
  velocity-window-seconds: 300
  reputation-ttl-seconds: 3600
  redis-timeout-ms: 5

ml:
  inference:
    url: http://localhost:8088

rules:
  service:
    url: http://localhost:8083

# Resilience4j circuit breaker configuration
resilience4j:
  circuitbreaker:
    instances:
      ml-inference:
        # Open after 50% failures in a 10-call sliding window
        failure-rate-threshold: 50
        sliding-window-size: 10
        sliding-window-type: COUNT_BASED
        # Stay open for 10 s, then move to HALF_OPEN
        wait-duration-in-open-state: 10s
        # Allow 3 calls in HALF_OPEN to probe recovery
        permitted-number-of-calls-in-half-open-state: 3
        # Slow calls (> 2 s) count as failures
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 80
        register-health-indicator: true
      rules-service:
        failure-rate-threshold: 50
        sliding-window-size: 10
        sliding-window-type: COUNT_BASED
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        slow-call-duration-threshold: 1s
        slow-call-rate-threshold: 80
        register-health-indicator: true
  timelimiter:
    instances:
      ml-inference:
        timeout-duration: 2s
      rules-service:
        timeout-duration: 1s
